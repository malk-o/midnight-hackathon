<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Guardian — Private AI Spending Agent</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 60px auto; background: #0b0b0f; color: #eee; }
  h1 { font-size: 1.4rem; }
  textarea { width: 100%; height: 80px; background: #16161d; color: #eee; border: 1px solid #333; border-radius: 8px; padding: 12px; font-size: 1rem; }
  button { margin-top: 10px; padding: 10px 18px; background: #6c5ce7; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
  button:disabled { opacity: 0.5; cursor: default; }
  select { margin-top: 10px; padding: 8px; background: #16161d; color: #eee; border: 1px solid #333; border-radius: 6px; }
  .card { margin-top: 24px; padding: 16px; border-radius: 8px; border: 1px solid #333; }
  .approved { border-color: #2ecc71; background: #10251a; }
  .blocked { border-color: #e74c3c; background: #2a1414; }
  pre { white-space: pre-wrap; font-size: 0.85rem; color: #aaa; }
</style>
</head>
<body>
  <h1>🛡️ Guardian — Private AI Spending Agent</h1>
  <p>Type a task. The agent will parse it, then a Midnight-backed guardrail will check spending policy + a private reputation proof.</p>

  <textarea id="task" placeholder="e.g. Book me a hotel for $150/night, travel category"></textarea><br/>

  <label>Simulate user: </label>
  <select id="userId">
    <option value="demo-user">demo-user (moderate reputation)</option>
    <option value="new-user">new-user (low reputation)</option>
    <option value="trusted-user">trusted-user (high reputation)</option>
  </select>
  <br/>

  <button id="submit">Send to agent</button>

  <div id="result"></div>

  <script>
    const API_BASE = "http://localhost:3001";

    document.getElementById("submit").addEventListener("click", async () => {
      const task = document.getElementById("task").value.trim();
      const userId = document.getElementById("userId").value;
      const resultDiv = document.getElementById("result");
      const btn = document.getElementById("submit");
      if (!task) return;

      btn.disabled = true;
      btn.textContent = "Thinking...";
      resultDiv.innerHTML = "";

      try {
        const res = await fetch(`${API_BASE}/agent/task`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task, userId }),
        });
        const data = await res.json();

        const cls = data.verdict?.approved ? "approved" : "blocked";
        resultDiv.innerHTML = `
          <div class="card ${cls}">
            <strong>${data.verdict?.approved ? "✅ Approved" : "⛔ Blocked"}</strong>
            <p>${data.verdict?.reason ?? ""}</p>
            <pre>${JSON.stringify(data.action, null, 2)}</pre>
          </div>
        `;
      } catch (err) {
        resultDiv.innerHTML = `<div class="card blocked">Error: ${err}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "Send to agent";
      }
    });
  </script>
</body>
</html>
